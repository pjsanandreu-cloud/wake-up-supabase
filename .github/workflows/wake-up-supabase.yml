name: Wake Up Supabase

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  ping-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Check if secret is set
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECTS_JSON }}" ]; then
            echo "❌ Secret SUPABASE_PROJECTS_JSON is not set."
            echo "Go to Settings → Secrets and variables → Actions and add it."
            exit 1
          fi

      - name: Ping Supabase projects (Update keepalive)
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          LENGTH=$(echo "$SUPABASE_PROJECTS_JSON" | jq '. | length')
          echo "📦 Found $LENGTH Supabase project(s)."

          if [ "$LENGTH" -eq 0 ]; then
            echo "⚠️ No projects defined in SUPABASE_PROJECTS_JSON."
            exit 0
          fi

          # Timestamp actual en formato ISO-8601 UTC
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          for i in $(seq 0 $((LENGTH - 1))); do
            URL=$(echo "$SUPABASE_PROJECTS_JSON" | jq -r ".[$i].url")
            KEY=$(echo "$SUPABASE_PROJECTS_JSON" | jq -r ".[$i].anon_key")

            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "⚠️ Skipping project at index $i — missing url."
              continue
            fi

            if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
              echo "⚠️ Skipping $URL — missing anon_key."
              continue
            fi

            # --- ACTUALIZACIÓN EN LA BASE DE DATOS ---
            # Hacemos un UPDATE (PATCH) sobre la fila id=1 para renovar pinged_at
            PING_URL="${URL%/}/rest/v1/keepalive?id=eq.1"
            echo "🌐 Updating PostgreSQL keepalive via: $PING_URL"

            set +e
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"pinged_at\": \"$NOW\"}" \
              "$PING_URL")
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "❌ Curl failed for $URL (exit code $CURL_EXIT). Skipping."
              continue
            fi

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ $URL responded with HTTP $HTTP_CODE — pinged_at set to $NOW."
            else
              echo "❌ $URL responded with HTTP $HTTP_CODE — check RLS permissions or URL."
            fi
          done
