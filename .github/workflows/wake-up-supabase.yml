name: Wake Up Supabase

on:
  schedule:
    - cron: '0 6 * * *'  # Se ejecuta cada día a las 06:00 UTC
  workflow_dispatch:      # Permite ejecución manual

jobs:
  ping-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Update keepalive on Supabase projects
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          python3 -c '
          import json, os, sys, urllib.request, datetime

          raw_json = os.environ.get("SUPABASE_PROJECTS_JSON", "")
          if not raw_json.strip():
              print("❌ Secret SUPABASE_PROJECTS_JSON is not set or empty.")
              sys.exit(1)

          try:
              projects = json.loads(raw_json)
          except Exception as e:
              print(f"❌ Error parsing JSON secret: {e}")
              sys.exit(1)

          print(f"📦 Found {len(projects)} Supabase project(s).\n")
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          for idx, proj in enumerate(projects):
              url = proj.get("url", "").rstrip("/")
              key = proj.get("anon_key", "").strip()
              name = proj.get("name", f"project-{idx+1}")

              if not url or not key:
                  print(f"⚠️ Skipping [{name}] — missing url or anon_key.")
                  continue

              target_url = f"{url}/rest/v1/keepalive?id=eq.1"
              print(f"🌐 Updating keepalive table: {name} ({url})")

              payload = json.dumps({"pinged_at": now_iso}).encode("utf-8")
              req = urllib.request.Request(
                  target_url,
                  data=payload,
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal"
                  },
                  method="PATCH"
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      code = resp.getcode()
                      print(f"✅ [{name}] updated successfully (HTTP {code}) — pinged_at set to {now_iso}\n")
              except urllib.error.HTTPError as e:
                  print(f"❌ [{name}] FAILED with HTTP {e.code}: {e.reason}")
                  print(f"   Check RLS permissions for UPDATE or verify API key for this project.\n")
              except Exception as e:
                  print(f"❌ Connection error for [{name}]: {e}\n")
          '
